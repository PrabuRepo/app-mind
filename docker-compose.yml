# Windows 11 note: requires Docker Desktop with the WSL2 backend enabled
# (the Docker Desktop installer prompts for this). Run `wsl --install` first
# if you don't already have a Linux distro registered under WSL. Once Docker
# Desktop is running, every command below and in SETUP.md is identical
# whether you run it from PowerShell, WSL, macOS, or Linux.

version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: appmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appmind
      POSTGRES_PASSWORD: appmind
      POSTGRES_DB: appmind
    ports:
      - "5432:5432"
    volumes:
      - appmind_pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: appmind-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - appmind_qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    container_name: appmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - appmind_redis_data:/data

  app:
    build: .
    container_name: appmind-app
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
      - redis
    environment:
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # Which indexed repository code questions are about (see code_context/).
      APPMIND_CODE_REPO: ${GITHUB_TARGET_REPO}
    env_file:
      - .env
    ports:
      - "8501:8501"

  # One-shot: writes the indexer's registry (targets.toml) from the application
  # profile, config/apps/<id>.yaml, into a shared volume, then exits. It uses
  # the app image because the profile loader lives there; the indexer itself
  # stays free of AppMind code and just reads the generated file.
  export-targets:
    build: .
    container_name: appmind-export-targets
    restart: "no"
    entrypoint: ["python", "-m", "app_profile.export_targets"]
    command: ["--out", "/generated/targets.toml"]
    volumes:
      - appmind_generated:/generated

  # One-shot: indexes the repositories in the generated registry into Postgres,
  # then exits. Built from ./indexer alone (it contains no AppMind code) and
  # given only the variables it needs, not the whole .env. The app does not
  # wait on it. Refresh manually with: docker compose run --rm indexer
  # (the registry is regenerated from the profile first, every time).
  indexer:
    build: ./indexer
    container_name: appmind-indexer
    restart: "no"
    depends_on:
      postgres:
        condition: service_started
      export-targets:
        condition: service_completed_successfully
    command: ["--targets", "/generated/targets.toml"]
    volumes:
      - appmind_generated:/generated:ro
    environment:
      POSTGRES_HOST: postgres
      GITHUB_TOKEN: ${GITHUB_TOKEN}

volumes:
  appmind_pg_data:
  appmind_qdrant_data:
  appmind_redis_data:
  appmind_generated:
