# yaml-language-server: $schema=../../app_profile/appmind-app.schema.json
#
# Example application profile: OrderFlow. A design illustration; the real one is
# config/apps/orderflow.yaml. This one must always validate against app_profile/appmind-app.schema.json.
#
# Required: schema_version, app (id, name) and sources.code. Everything else
# is optional; defaults are noted inline.

schema_version: 1

app:
  id: orderflow
  name: OrderFlow
  description: an order-processing service
  owners: [team-orders]

# Optional. Without it the off-topic guardrail is skipped (an off-topic question
# is still caught later, when retrieval finds nothing relevant).
# scope.description feeds the input guardrail; scope.aliases feeds the supervisor.
scope:
  description: >
    OrderFlow order-processing service: placing orders, payment processing,
    PaymentClient, gateway timeouts, retries, and duplicate charges, inventory
    reservation, InventoryClient, stock levels and oversell, order confirmation
    notifications, NotificationService, incidents and root cause investigations,
    and OrderFlow's architecture, source code, and code dependencies.

  # Components that questions describe without naming ("charged twice" means
  # PaymentClient). Used only for incident and impact questions, and only when
  # the question does not name a component itself. A word matches as part of a
  # word ("invent" matches "inventory"); the first listed component wins.
  aliases:
    PaymentClient: [payment, charge]
    InventoryClient: [invent, stock, oversell]

sources:
  code:
    # Exported to the indexer as a generated registry (indexer/targets.toml)
    - repo: PrabuRepo/orderflow-app
      exclude: ["**/tests/**"]
      # Defaults, so they can be omitted:
      #   ref: main
      #   source_root: .
      #   auth: { secret: GITHUB_TOKEN }
  # Each group is loaded into the Qdrant collection of the same name
  docs: [{ path: knowledge-domains/docs }]
  incidents: [{ path: knowledge-domains/incidents }]
